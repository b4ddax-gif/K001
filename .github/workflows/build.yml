name: Build K001 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract K001
        run: |
          mkdir project
          unzip -q "k001 (1).zip" -d project

      - name: Find Android project
        run: |
          SETTINGS=$(find project -name "settings.gradle*" -type f | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: K001-APK
          path: project/**/build/outputs/apk/debug/*.apk
